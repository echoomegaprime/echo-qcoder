<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0b0f17" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Echo" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>Echo</title>
<style>
  :root{
    --bg:#0b0f17; --panel:#111825; --panel2:#0e1420; --line:#1e2a3d;
    --txt:#e8eef7; --dim:#8ea0b9; --accent:#4f8cff; --accent2:#7b5cff; --ok:#38d39f; --err:#ff6b6b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--txt);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;}
  header{display:flex; align-items:center; gap:12px; padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background:linear-gradient(180deg,#0e1522,#0b0f17); border-bottom:1px solid var(--line); flex:0 0 auto;}
  .logo{width:34px;height:34px;border-radius:9px;flex:0 0 auto;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-weight:800;color:#fff;box-shadow:0 4px 14px rgba(79,140,255,.35)}
  .htitle{font-weight:700;letter-spacing:.2px}
  .hsub{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .grow{flex:1}
  .link{font-size:12px;color:var(--dim);background:none;border:none;cursor:pointer;padding:6px}
  main{flex:1 1 auto; overflow-y:auto; padding:18px 14px 8px; -webkit-overflow-scrolling:touch}
  .row{display:flex;margin:10px 0;animation:rise .25s ease}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .row.me{justify-content:flex-end}
  .bubble{max-width:84%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
  .them .bubble{background:var(--panel);border:1px solid var(--line);border-top-left-radius:5px}
  .me .bubble{background:linear-gradient(135deg,#22375f,#1b2a44);border:1px solid #2b3f63;border-top-right-radius:5px}
  .typing .bubble{color:var(--dim)} .typing span{display:inline-block;width:6px;height:6px;margin:0 1px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .empty{color:var(--dim);text-align:center;margin:12vh auto;max-width:290px}
  .empty .big{font-size:20px;color:var(--txt);margin-bottom:8px;font-weight:600}
  footer{flex:0 0 auto;padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);background:var(--panel2);border-top:1px solid var(--line)}
  form.chat{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;max-height:120px;min-height:44px;padding:11px 14px;border-radius:14px;background:#0b111c;border:1px solid var(--line);color:var(--txt);font:inherit;outline:none}
  textarea:focus{border-color:var(--accent)}
  button.send{width:44px;height:44px;flex:0 0 auto;border:none;border-radius:14px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;box-shadow:0 4px 14px rgba(79,140,255,.35)}
  button.send:active{transform:scale(.94)} button.send:disabled{opacity:.4} svg{display:block}
  /* login */
  #login{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px;z-index:10}
  #login.hidden{display:none}
  #login .logo{width:64px;height:64px;border-radius:18px;font-size:30px;margin-bottom:6px}
  #login h1{margin:0;font-size:22px}
  #login p{margin:0 0 8px;color:var(--dim);font-size:13px;text-align:center;max-width:300px}
  #login input{width:100%;max-width:320px;padding:13px 15px;border-radius:13px;background:var(--panel);border:1px solid var(--line);color:var(--txt);font:inherit;outline:none}
  #login input:focus{border-color:var(--accent)}
  #login button.primary{width:100%;max-width:320px;padding:13px;border:none;border-radius:13px;cursor:pointer;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 14px rgba(79,140,255,.35)}
  #login button.primary:active{transform:scale(.98)} #login button.primary:disabled{opacity:.5}
  #err{color:var(--err);font-size:13px;min-height:16px;text-align:center}
</style>
</head>
<body>
<!-- LOGIN -->
<div id="login">
  <div class="logo">E</div>
  <h1>Echo</h1>
  <p>Sign in to command the fleet. This unlocks your full authenticated agent — every ECHO capability, gated to you alone.</p>
  <input id="email" type="email" placeholder="Email" autocomplete="username" inputmode="email" />
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
  <button class="primary" id="loginBtn">Sign in</button>
  <div id="err"></div>
</div>

<!-- APP -->
<header>
  <div class="logo">E</div>
  <div>
    <div class="htitle">Echo</div>
    <div class="hsub"><span class="dot"></span> <span id="mode">sovereign agent</span></div>
  </div>
  <div class="grow"></div>
  <button class="link" id="logoutBtn">Sign out</button>
</header>
<main id="log">
  <div class="empty" id="empty">
    <div class="big">Command the fleet</div>
    Ask Echo to do anything — recall memory, run a task, check the cluster, invoke any capability. Add to Home Screen to install.
  </div>
</main>
<footer>
  <form class="chat" id="f">
    <textarea id="in" placeholder="Tell Echo what to do…" rows="1" autocomplete="off"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
    </button>
  </form>
</footer>
<script>
  const AGENT = "https://agent.echo-op.com";
  const $ = s => document.querySelector(s);
  const loginView=$('#login'), log=$('#log'), form=$('#f'), input=$('#in'), sendBtn=$('#send'), empty=$('#empty'), errBox=$('#err');
  let token = localStorage.getItem('echo_token') || '';
  const hist = JSON.parse(localStorage.getItem('echo_hist')||'[]');

  function showApp(){ loginView.classList.add('hidden'); }
  function showLogin(msg){ loginView.classList.remove('hidden'); if(msg) errBox.textContent=msg; }
  if(token){ showApp(); hist.forEach(m=>add(m.role,m.text,false)); } else { showLogin(''); }

  $('#loginBtn').addEventListener('click', doLogin);
  $('#password').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  async function doLogin(){
    const email=$('#email').value.trim(), password=$('#password').value;
    if(!email||!password){ errBox.textContent='Enter your email and password.'; return; }
    errBox.textContent=''; const b=$('#loginBtn'); b.disabled=true; b.textContent='Signing in…';
    try{
      const r=await fetch(AGENT+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
      const d=await r.json();
      if(r.ok && d.access_token){ token=d.access_token; localStorage.setItem('echo_token',token); showApp(); }
      else { errBox.textContent='Sign-in failed. Check your credentials.'; }
    }catch(e){ errBox.textContent='Cannot reach Echo. Check your connection.'; }
    finally{ b.disabled=false; b.textContent='Sign in'; }
  }
  $('#logoutBtn').addEventListener('click', ()=>{ token=''; localStorage.removeItem('echo_token'); showLogin('Signed out.'); });

  input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';});
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
  function add(role,text,save=true){
    if(empty&&empty.parentNode) empty.remove();
    const row=document.createElement('div'); row.className='row '+(role==='me'?'me':'them');
    const bub=document.createElement('div'); bub.className='bubble'; bub.textContent=text; row.appendChild(bub); log.appendChild(row);
    log.scrollTop=log.scrollHeight;
    if(save){ hist.push({role,text}); localStorage.setItem('echo_hist',JSON.stringify(hist.slice(-60))); }
    return bub;
  }
  function typing(){ const row=document.createElement('div'); row.className='row them typing'; row.innerHTML='<div class="bubble"><span></span><span></span><span></span></div>'; log.appendChild(row); log.scrollTop=log.scrollHeight; return row; }
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const q=input.value.trim(); if(!q) return;
    if(!token){ showLogin('Sign in first.'); return; }
    add('me',q); input.value=''; input.style.height='auto'; sendBtn.disabled=true;
    const t=typing();
    try{
      const r=await fetch(AGENT+'/agent',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({message:q,history:hist.slice(-8)})});
      if(r.status===401){ t.remove(); token=''; localStorage.removeItem('echo_token'); showLogin('Session expired — sign in again.'); return; }
      const d=await r.json(); t.remove();
      add('them',(d&&d.result)?d.result:"…I couldn't complete that. Try again.");
    }catch(e){ t.remove(); add('them',"Can't reach Echo right now. Try again in a moment."); }
    finally{ sendBtn.disabled=false; input.focus(); }
  });
  if('serviceWorker' in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
