version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:17"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    groups:
      qcoder-runtime:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/scripts/inspector"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:47"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:17"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
